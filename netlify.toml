[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The sync endpoint is a function, so it must not be swallowed by the SPA
# catch-all below. Order matters here.
[[redirects]]
  from = "/api/board"
  to = "/.netlify/functions/board"
  status = 200

# Single-page app: every path resolves to the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# The caseload is encrypted, but it should still never sit in a shared cache.
[[headers]]
  for = "/api/board"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/caseload.enc.json"
  [headers.values]
    Cache-Control = "no-store"

# The worker itself must never be served stale, or updates never land.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
